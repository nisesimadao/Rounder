name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Rounder
        2. Change ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rounder version
      placeholder: "v2.1.4"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.5"
    validations:
      required: true
  - type: dropdown
    id: display
    attributes:
      label: Display type
      options:
        - Built-in display
        - External display
        - Multiple displays
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot or screen recording
      description: Drag images or videos here if the bug is visual.

