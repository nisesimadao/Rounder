name: Verify Menu Panel Branch

on:
  push:
    branches:
      - menu-panel-geometry-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test CornerGeometry
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/CornerGeometryTests.swift \
            Rounder/CornerGeometry.swift \
            -o "$RUNNER_TEMP/corner-geometry-tests"
          "$RUNNER_TEMP/corner-geometry-tests"

      - name: Build Rounder
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Smoke test menu-bar startup
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug/Rounder.app"
          LOG="$RUNNER_TEMP/rounder-smoke.log"

          # Skip onboarding and disable overlays so this check isolates app/menu
          # construction from display/Space behavior that a CI runner cannot
          # faithfully represent.
          defaults write com.nisesimadao.Rounder hasLaunchedBefore -bool true
          defaults write com.nisesimadao.Rounder isEnabled -bool false

          "$APP/Contents/MacOS/Rounder" >"$LOG" 2>&1 &
          PID=$!
          sleep 5

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "Rounder exited during startup smoke test"
            cat "$LOG"
            exit 1
          fi

          kill "$PID" || true
          wait "$PID" || true
          cat "$LOG"

      - name: Prepare isolated test app
        run: |
          set -euo pipefail
          SOURCE_APP="build/Build/Products/Debug/Rounder.app"
          TEST_APP="$RUNNER_TEMP/Rounder-MenuPanel-Test.app"
          TEST_ID="com.nisesimadao.Rounder.MenuPanelTest"

          rm -rf "$TEST_APP"
          ditto "$SOURCE_APP" "$TEST_APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $TEST_ID" "$TEST_APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Rounder Menu Panel Test" "$TEST_APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName RounderMenuPanelTest" "$TEST_APP/Contents/Info.plist"

          ACTUAL_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TEST_APP/Contents/Info.plist")
          test "$ACTUAL_ID" = "$TEST_ID"

      - name: Smoke test isolated test app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Rounder-MenuPanel-Test.app"
          TEST_ID="com.nisesimadao.Rounder.MenuPanelTest"
          LOG="$RUNNER_TEMP/rounder-isolated-smoke.log"

          defaults write "$TEST_ID" hasLaunchedBefore -bool true
          defaults write "$TEST_ID" isEnabled -bool false

          "$APP/Contents/MacOS/Rounder" >"$LOG" 2>&1 &
          PID=$!
          sleep 5

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "Isolated Rounder test app exited during startup smoke test"
            cat "$LOG"
            exit 1
          fi

          kill "$PID" || true
          wait "$PID" || true
          cat "$LOG"

      - name: Package isolated debug app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Rounder-MenuPanel-Test.app" \
            Rounder-menu-panel-test.zip

      - name: Upload isolated debug app
        uses: actions/upload-artifact@v4
        with:
          name: Rounder-menu-panel-test
          path: Rounder-menu-panel-test.zip
          if-no-files-found: error
          retention-days: 7
