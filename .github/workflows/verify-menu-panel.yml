name: Verify Menu Panel Branch

on:
  push:
    branches:
      - menu-panel-geometry-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Rounder
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Smoke test menu-bar startup
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug/Rounder.app"
          LOG="$RUNNER_TEMP/rounder-smoke.log"

          # Skip onboarding and disable overlays so this check isolates app/menu
          # construction from display/Space behavior that a CI runner cannot
          # faithfully represent.
          defaults write com.nisesimadao.Rounder hasLaunchedBefore -bool true
          defaults write com.nisesimadao.Rounder isEnabled -bool false

          "$APP/Contents/MacOS/Rounder" >"$LOG" 2>&1 &
          PID=$!
          sleep 5

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "Rounder exited during startup smoke test"
            cat "$LOG"
            exit 1
          fi

          kill "$PID" || true
          wait "$PID" || true
          cat "$LOG"

      - name: Package debug app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug/Rounder.app \
            Rounder-menu-panel-debug.zip

      - name: Upload debug app
        uses: actions/upload-artifact@v4
        with:
          name: Rounder-menu-panel-debug
          path: Rounder-menu-panel-debug.zip
          if-no-files-found: error
          retention-days: 7
