name: Build & Release

# バージョンタグ（例: v1.2.0）を push すると、ビルドして .zip を Releases に自動で並べる。
# 手動実行（Run workflow）でもビルドの確認だけできる（その場合はリリースを作らずアーティファクトに保存）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve app version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(
              xcodebuild -project Rounder.xcodeproj -scheme Rounder -configuration Release -showBuildSettings |
              awk -F '= ' '/MARKETING_VERSION/ { print $2; exit }'
            )"
          fi

          if [[ -z "$VERSION" ]]; then
            echo "::error::Failed to resolve MARKETING_VERSION"; exit 1
          fi

          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building Rounder $VERSION (${GITHUB_RUN_NUMBER})"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            clean build

      - name: Validate app version
        run: |
          APP="build/Build/Products/Release/Rounder.app"
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")

          echo "Built Rounder $ACTUAL_VERSION ($ACTUAL_BUILD)"

          if [[ "$ACTUAL_VERSION" != "$MARKETING_VERSION" ]]; then
            echo "::error::Expected version $MARKETING_VERSION, got $ACTUAL_VERSION"; exit 1
          fi

      - name: Package
        run: |
          APP="build/Build/Products/Release/Rounder.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Rounder.app not found at $APP"; exit 1
          fi
          # ad-hoc 署名しておくと Gatekeeper の扱いが少しマシになる（配布署名ではない）
          codesign --force --deep --sign - "$APP" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" Rounder.zip
          shasum -a 256 Rounder.zip > Rounder.zip.sha256
          echo "Packaged: $(du -h Rounder.zip | cut -f1)"
          cat Rounder.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rounder
          path: |
            Rounder.zip
            Rounder.zip.sha256

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Rounder.zip
            Rounder.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
