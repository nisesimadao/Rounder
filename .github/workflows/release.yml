name: Build & Release

# バージョンタグ（例: v1.2.0）を push すると、ビルドして .zip を Releases に自動で並べる。
# 手動実行（Run workflow）でもビルドの確認だけできる（その場合はリリースを作らずアーティファクトに保存）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package
        run: |
          APP="build/Build/Products/Release/Rounder.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Rounder.app not found at $APP"; exit 1
          fi
          # ad-hoc 署名しておくと Gatekeeper の扱いが少しマシになる（配布署名ではない）
          codesign --force --deep --sign - "$APP" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" Rounder.zip
          echo "Packaged: $(du -h Rounder.zip | cut -f1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rounder
          path: Rounder.zip

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Rounder.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
