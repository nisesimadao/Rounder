name: Build & Release

# バージョンタグ（例: v1.2.0）を push すると、テスト→ビルド→Releases公開まで自動実行。
# 手動実行（Run workflow）でも同じ検証とビルドを行い、その場合はReleaseを作らずartifactに保存する。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test CornerGeometry
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/CornerGeometryTests.swift \
            Rounder/CornerGeometry.swift \
            -o "$RUNNER_TEMP/corner-geometry-tests"
          "$RUNNER_TEMP/corner-geometry-tests"

      - name: Test localization coverage
        run: |
          set -euo pipefail
          python3 Tests/LocalizationTests.py

      - name: Resolve app version
        run: |
          set -euo pipefail

          BUILD_SETTINGS="$(
            xcodebuild -project Rounder.xcodeproj -scheme Rounder -configuration Release -showBuildSettings
          )"
          PROJECT_VERSION="$(
            printf '%s\n' "$BUILD_SETTINGS" |
            awk -F '= ' '/MARKETING_VERSION/ { print $2; exit }'
          )"
          BUILD_NUMBER="$(
            printf '%s\n' "$BUILD_SETTINGS" |
            awk -F '= ' '/CURRENT_PROJECT_VERSION/ { print $2; exit }'
          )"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$PROJECT_VERSION"
          fi

          if [[ -z "$VERSION" || -z "$BUILD_NUMBER" ]]; then
            echo "::error::Failed to resolve app version/build number"; exit 1
          fi

          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Building Rounder $VERSION ($BUILD_NUMBER)"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            clean build

      - name: Validate app version
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")

          echo "Built Rounder $ACTUAL_VERSION ($ACTUAL_BUILD)"

          if [[ "$ACTUAL_VERSION" != "$MARKETING_VERSION" ]]; then
            echo "::error::Expected version $MARKETING_VERSION, got $ACTUAL_VERSION"; exit 1
          fi
          if [[ "$ACTUAL_BUILD" != "$CURRENT_PROJECT_VERSION" ]]; then
            echo "::error::Expected build $CURRENT_PROJECT_VERSION, got $ACTUAL_BUILD"; exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Rounder.app not found at $APP"; exit 1
          fi
          # This is ad-hoc signing only; the public build is not Developer ID signed/notarized.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Rounder.zip
          unzip -t Rounder.zip
          echo "Packaged: $(du -h Rounder.zip | cut -f1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rounder
          path: Rounder.zip
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Rounder.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
