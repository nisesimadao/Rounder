name: Verify macOS 14.6 Compatibility

on:
  push:
    branches:
      - fix-v2.2.0-ui-polish
    paths:
      - .github/workflows/verify-macos14-footer.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-v2.2.0-ui-polish

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make Quit destructive
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("Rounder/MenuBarPanelView.swift")
          source = path.read_text()

          old_call = '''            PanelFooterButton(systemImage: "power", title: String(localized: "quit_menu")) {
                onQuit()
            }'''
          new_call = '''            PanelFooterButton(
                systemImage: "power",
                title: String(localized: "quit_menu"),
                isDestructive: true
            ) {
                onQuit()
            }'''

          old_struct = '''private struct PanelFooterButton: View {
    let systemImage: String
    let title: String
    let action: () -> Void

    @State private var isHovered = false

    var body: some View {
        Button(action: action) {
            Label(title, systemImage: systemImage)
                .font(.system(size: 11))
                .padding(.horizontal, 8)
                .frame(height: 24)
                .background(
                    RoundedRectangle(cornerRadius: 6, style: .continuous)
                        .fill(isHovered ? Color.primary.opacity(0.08) : Color.clear)
                )
                .contentShape(Rectangle())
        }
        .buttonStyle(.plain)
        .onHover { isHovered = $0 }
        .animation(.easeOut(duration: 0.1), value: isHovered)
    }
}'''
          new_struct = '''private struct PanelFooterButton: View {
    let systemImage: String
    let title: String
    var isDestructive: Bool = false
    let action: () -> Void

    @State private var isHovered = false

    var body: some View {
        Button(action: action) {
            Label(title, systemImage: systemImage)
                .font(.system(size: 11))
                .foregroundStyle(isDestructive ? Color.red : Color.primary)
                .padding(.horizontal, 8)
                .frame(height: 24)
                .background(
                    RoundedRectangle(cornerRadius: 6, style: .continuous)
                        .fill(
                            isHovered
                                ? (isDestructive ? Color.red.opacity(0.12) : Color.primary.opacity(0.08))
                                : Color.clear
                        )
                )
                .contentShape(Rectangle())
        }
        .buttonStyle(.plain)
        .onHover { isHovered = $0 }
        .animation(.easeOut(duration: 0.1), value: isHovered)
    }
}'''

          if source.count(old_call) != 1:
              raise SystemExit(f"Expected one Quit footer call, found {source.count(old_call)}")
          if source.count(old_struct) != 1:
              raise SystemExit(f"Expected one footer button implementation, found {source.count(old_struct)}")

          source = source.replace(old_call, new_call).replace(old_struct, new_struct)
          path.write_text(source)
          PY
          git diff --check

      - name: Test CornerGeometry
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/CornerGeometryTests.swift \
            Rounder/CornerGeometry.swift \
            -o "$RUNNER_TEMP/corner-geometry-tests"
          "$RUNNER_TEMP/corner-geometry-tests"

      - name: Build Release for 14.6+
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MACOSX_DEPLOYMENT_TARGET=14.6 \
            clean build

      - name: Validate build metadata
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          test "$VERSION" = "2.2.0"
          test "$BUILD" = "33"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Rounder")
          [[ "$ARCHS" == *"arm64"* ]]
          [[ "$ARCHS" == *"x86_64"* ]]
          otool -l "$APP/Contents/MacOS/Rounder" | grep -A4 LC_BUILD_VERSION

      - name: Package runtime artifact
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Rounder-macos14-test.zip
          unzip -t Rounder-macos14-test.zip

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rounder-v2.2.0-build33-macos14-test
          path: Rounder-macos14-test.zip
          retention-days: 3

      - name: Commit footer polish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rounder/MenuBarPanelView.swift
          git commit -m "Style Quit as a destructive action"
          git push origin HEAD:fix-v2.2.0-ui-polish

  runtime-macos14:
    needs: build
    runs-on: macos-14
    steps:
      - name: Show macOS version
        run: sw_vers

      - name: Download Release app
        uses: actions/download-artifact@v4
        with:
          name: Rounder-v2.2.0-build33-macos14-test

      - name: Unpack
        run: |
          set -euo pipefail
          ditto -x -k Rounder-macos14-test.zip .
          test -x Rounder.app/Contents/MacOS/Rounder

      - name: Verify minimum OS and architectures
        run: |
          set -euo pipefail
          file Rounder.app/Contents/MacOS/Rounder
          lipo -archs Rounder.app/Contents/MacOS/Rounder
          otool -l Rounder.app/Contents/MacOS/Rounder | grep -A4 LC_BUILD_VERSION

      - name: Smoke test menu-bar mode on macOS 14
        run: |
          set -euo pipefail
          defaults write com.nisesimadao.Rounder hasLaunchedBefore -bool true
          defaults write com.nisesimadao.Rounder isEnabled -bool false
          ./Rounder.app/Contents/MacOS/Rounder > "$RUNNER_TEMP/rounder14-menu.log" 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/rounder14-menu.log"
            exit 1
          fi
          kill "$PID" || true
          wait "$PID" || true

      - name: Smoke test onboarding on macOS 14
        run: |
          set -euo pipefail
          defaults write com.nisesimadao.Rounder hasLaunchedBefore -bool false
          ./Rounder.app/Contents/MacOS/Rounder > "$RUNNER_TEMP/rounder14-onboarding.log" 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/rounder14-onboarding.log"
            exit 1
          fi
          kill "$PID" || true
          wait "$PID" || true
