name: Verify v2.2.0 Build 35

on:
  push:
    branches:
      - fix-v2.2.0-ui-polish
    paths:
      - .github/workflows/verify-v2.2.0-build35.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-v2.2.0-ui-polish

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bump build number to 35
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("Rounder.xcodeproj/project.pbxproj")
          source = path.read_text()
          old = "CURRENT_PROJECT_VERSION = 34;"
          new = "CURRENT_PROJECT_VERSION = 35;"
          count = source.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 build-number entries, found {count}")
          path.write_text(source.replace(old, new))
          PY
          git diff --check

      - name: Test CornerGeometry
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/CornerGeometryTests.swift \
            Rounder/CornerGeometry.swift \
            -o "$RUNNER_TEMP/corner-geometry-tests"
          "$RUNNER_TEMP/corner-geometry-tests"

      - name: Test localization coverage
        run: |
          set -euo pipefail
          python3 Tests/LocalizationTests.py

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Validate app
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Rounder")
          test "$VERSION" = "2.2.0"
          test "$BUILD" = "35"
          [[ "$ARCHS" == *"arm64"* ]]
          [[ "$ARCHS" == *"x86_64"* ]]
          echo "Validated Rounder $VERSION ($BUILD): $ARCHS"

      - name: Smoke test startup
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          LOG="$RUNNER_TEMP/rounder-build35-smoke.log"
          defaults write com.nisesimadao.Rounder hasLaunchedBefore -bool true
          defaults write com.nisesimadao.Rounder isEnabled -bool false
          "$APP/Contents/MacOS/Rounder" >"$LOG" 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$LOG"
            exit 1
          fi
          kill "$PID" || true
          wait "$PID" || true

      - name: Package release candidate
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Rounder-v2.2.0-build35.zip
          unzip -t Rounder-v2.2.0-build35.zip
          shasum -a 256 Rounder-v2.2.0-build35.zip

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Rounder-v2.2.0-build35
          path: Rounder-v2.2.0-build35.zip
          if-no-files-found: error
          retention-days: 3

      - name: Commit build number
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rounder.xcodeproj/project.pbxproj
          git commit -m "Bump build number to 35"
          git pull --rebase origin fix-v2.2.0-ui-polish
          git push origin HEAD:fix-v2.2.0-ui-polish
