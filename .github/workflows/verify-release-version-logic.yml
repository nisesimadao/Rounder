name: Verify Release Version Logic

on:
  push:
    branches:
      - release-prep-v2.2.0
    paths:
      - .github/workflows/verify-release-version-logic.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release-prep-v2.2.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test CornerGeometry
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/CornerGeometryTests.swift \
            Rounder/CornerGeometry.swift \
            -o "$RUNNER_TEMP/corner-geometry-tests"
          "$RUNNER_TEMP/corner-geometry-tests"

      - name: Resolve app version
        run: |
          set -euo pipefail

          BUILD_SETTINGS="$(
            xcodebuild -project Rounder.xcodeproj -scheme Rounder -configuration Release -showBuildSettings
          )"
          PROJECT_VERSION="$(
            printf '%s\n' "$BUILD_SETTINGS" |
            awk -F '= ' '/MARKETING_VERSION/ { print $2; exit }'
          )"
          BUILD_NUMBER="$(
            printf '%s\n' "$BUILD_SETTINGS" |
            awk -F '= ' '/CURRENT_PROJECT_VERSION/ { print $2; exit }'
          )"

          VERSION="$PROJECT_VERSION"

          if [[ -z "$VERSION" || -z "$BUILD_NUMBER" ]]; then
            echo "::error::Failed to resolve app version/build number"; exit 1
          fi

          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Building Rounder $VERSION ($BUILD_NUMBER)"

          test "$VERSION" = "2.2.0"
          test "$BUILD_NUMBER" = "32"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            clean build

      - name: Validate app version
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")

          echo "Built Rounder $ACTUAL_VERSION ($ACTUAL_BUILD)"
          test "$ACTUAL_VERSION" = "$MARKETING_VERSION"
          test "$ACTUAL_BUILD" = "$CURRENT_PROJECT_VERSION"
          test "$ACTUAL_VERSION" = "2.2.0"
          test "$ACTUAL_BUILD" = "32"
