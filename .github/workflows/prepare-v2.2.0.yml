name: Prepare v2.2.0 Project Version

on:
  push:
    branches:
      - release-prep-v2.2.0
    paths:
      - .github/workflows/prepare-v2.2.0.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release-prep-v2.2.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Bump local project version
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("Rounder.xcodeproj/project.pbxproj")
          source = path.read_text()

          old_build = "CURRENT_PROJECT_VERSION = 31;"
          new_build = "CURRENT_PROJECT_VERSION = 32;"
          old_version = "MARKETING_VERSION = 2.1.4;"
          new_version = "MARKETING_VERSION = 2.2.0;"

          if source.count(old_build) != 2:
              raise SystemExit(f"Expected exactly 2 build-version entries, found {source.count(old_build)}")
          if source.count(old_version) != 2:
              raise SystemExit(f"Expected exactly 2 marketing-version entries, found {source.count(old_version)}")

          source = source.replace(old_build, new_build)
          source = source.replace(old_version, new_version)
          path.write_text(source)
          PY

          git diff --check
          git diff -- Rounder.xcodeproj/project.pbxproj

      - name: Test CornerGeometry
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/CornerGeometryTests.swift \
            Rounder/CornerGeometry.swift \
            -o "$RUNNER_TEMP/corner-geometry-tests"
          "$RUNNER_TEMP/corner-geometry-tests"

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Validate built local version
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          test "$VERSION" = "2.2.0"
          test "$BUILD" = "32"
          echo "Validated Rounder $VERSION ($BUILD)"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rounder.xcodeproj/project.pbxproj
          git commit -m "Bump project version to 2.2.0"
          git push origin HEAD:release-prep-v2.2.0
