name: Verify Corner Initialization Cleanup

on:
  push:
    branches:
      - corner-geometry-initialization-cleanup
    paths:
      - .github/workflows/apply-corner-init-cleanup.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test CornerGeometry
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/CornerGeometryTests.swift \
            Rounder/CornerGeometry.swift \
            -o "$RUNNER_TEMP/corner-geometry-tests"
          "$RUNNER_TEMP/corner-geometry-tests"

      - name: Build Rounder
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Smoke test startup
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug/Rounder.app"
          LOG="$RUNNER_TEMP/rounder-smoke.log"

          defaults write com.nisesimadao.Rounder hasLaunchedBefore -bool true
          defaults write com.nisesimadao.Rounder isEnabled -bool false

          "$APP/Contents/MacOS/Rounder" >"$LOG" 2>&1 &
          PID=$!
          sleep 5

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "Rounder exited during startup smoke test"
            cat "$LOG"
            exit 1
          fi

          kill "$PID" || true
          wait "$PID" || true
          cat "$LOG"
