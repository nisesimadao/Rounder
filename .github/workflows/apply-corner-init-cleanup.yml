name: Apply Corner Initialization Cleanup

on:
  push:
    branches:
      - corner-geometry-initialization-cleanup
    paths:
      - .github/workflows/apply-corner-init-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: corner-geometry-initialization-cleanup

      - name: Apply exact geometry refactor
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("Rounder/RounderApp.swift")
          source = path.read_text()

          size_start_marker = "        // Squircle は円より角に沿って膨らむため、iOS 実機と同様に辺方向へ長く伸ばして描く。"
          size_end_marker = "        // 選択されたディスプレイのみにオーバーレイを作成"
          specs_start_marker = "            // 各角の「物理的な位置」と、その角を描画するときに使う CornerType の対応表。"
          specs_end_marker = "            // ゲーミングモードでは、四隅に加えて画面のふち全体をGPU合成で発光させる（1スクリーン1枚）"

          for marker in [size_start_marker, size_end_marker, specs_start_marker, specs_end_marker]:
              if source.count(marker) != 1:
                  raise SystemExit(f"Expected marker once: {marker!r}; found {source.count(marker)}")

          size_start = source.index(size_start_marker)
          size_end = source.index(size_end_marker)
          new_size = "\n".join([
              "        // Initial creation and live Radius/Shape updates must use the exact same",
              "        // sizing rule (including Squircle's 1.8x backing window and pixel rounding).",
              "        let cornerSize = CornerGeometry.cornerSize(",
              "            radius: CGFloat(configuration.radius),",
              "            style: configuration.cutoutStyle",
              "        )",
              "        ",
          ]) + "\n"
          source = source[:size_start] + new_size + source[size_end:]

          specs_start = source.index(specs_start_marker)
          specs_end = source.index(specs_end_marker)
          new_specs = "\n".join([
              "            // Keep physical corner identity separate from the unflipped AppKit",
              "            // drawing corner. CornerGeometry owns placement; ScreenCorner owns the",
              "            // drawing-corner and gaming-hue mappings used by both creation and live updates.",
              "            let cornerStates: [(corner: ScreenCorner, enabled: Bool)] = [",
              "                (.topLeft, configuration.topLeftEnabled),",
              "                (.topRight, configuration.topRightEnabled),",
              "                (.bottomLeft, configuration.bottomLeftEnabled),",
              "                (.bottomRight, configuration.bottomRightEnabled)",
              "            ]",
              "",
              "            for state in cornerStates where state.enabled {",
              "                let window = CornerOverlayWindow(",
              "                    corner: CornerGeometry.windowOrigin(",
              "                        in: frame,",
              "                        corner: state.corner,",
              "                        cornerSize: cornerSize",
              "                    ),",
              "                    size: cornerSize,",
              "                    radius: CGFloat(configuration.radius),",
              "                    color: configuration.color,",
              "                    cutoutStyle: configuration.cutoutStyle,",
              "                    cornerType: state.corner.drawingCorner",
              "                )",
              "                overlayWindows.append(window)",
              "                if configuration.superGamingMode {",
              "                    window.setGamingMode(",
              "                        true,",
              "                        speed: configuration.gamingSpeed,",
              "                        baseHue: state.corner.gamingBaseHue",
              "                    )",
              "                }",
              "            }",
              "",
          ]) + "\n"
          source = source[:specs_start] + new_specs + source[specs_end:]

          path.write_text(source)
          PY

      - name: Verify diff hygiene
        run: |
          git diff --check
          git diff -- Rounder/RounderApp.swift

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rounder/RounderApp.swift
          git commit -m "Use shared geometry for initial corner creation"
          git push origin HEAD:corner-geometry-initialization-cleanup
