name: Verify v2.2.0 UI Polish

on:
  push:
    branches:
      - fix-v2.2.0-ui-polish
    paths:
      - .github/workflows/verify-v2.2.0-ui-polish.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-v2.2.0-ui-polish

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test CornerGeometry
        run: |
          set -euo pipefail
          xcrun swiftc \
            Tests/CornerGeometryTests.swift \
            Rounder/CornerGeometry.swift \
            -o "$RUNNER_TEMP/corner-geometry-tests"
          "$RUNNER_TEMP/corner-geometry-tests"

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project Rounder.xcodeproj \
            -scheme Rounder \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Validate build
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          test "$VERSION" = "2.2.0"
          test "$BUILD" = "33"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Rounder")
          [[ "$ARCHS" == *"arm64"* ]]
          [[ "$ARCHS" == *"x86_64"* ]]
          echo "Validated Rounder $VERSION ($BUILD): $ARCHS"

      - name: Smoke test startup
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          LOG="$RUNNER_TEMP/rounder-v2.2.0-ui-polish-smoke.log"
          defaults write com.nisesimadao.Rounder hasLaunchedBefore -bool true
          defaults write com.nisesimadao.Rounder isEnabled -bool false
          "$APP/Contents/MacOS/Rounder" >"$LOG" 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$LOG"
            exit 1
          fi
          kill "$PID" || true
          wait "$PID" || true

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/Rounder.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Rounder.zip
          unzip -t Rounder.zip
          shasum -a 256 Rounder.zip

      - name: Upload test RC
        uses: actions/upload-artifact@v4
        with:
          name: Rounder-v2.2.0-build33
          path: Rounder.zip
          if-no-files-found: error
          retention-days: 3
